services:
  app:
    build:
      context: ./docker/php
    container_name: taskflow_app
    volumes:
      - ./backend:/var/www/html
    networks:
      - taskflow

  nginx:
    image: nginx:alpine
    container_name: taskflow_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - taskflow

  mysql:
    image: mysql:8.0
    container_name: taskflow_mysql
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - taskflow
    
  frontend:
    image: node:20-alpine
    container_name: taskflow_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - taskflow

networks:
  taskflow:

volumes:
  mysql_data:
